name: Documentation
description: The README, a comment or a page at docs.kode.diy is wrong, missing, unclear or broken.
type: Task
labels:
  - documentation
assignees:
  - jbenedictocenteno
body:
  - type: markdown
    attributes:
      value: |
        When the documentation and the code disagree, the code is the truth and the documentation is the bug. Say what it claims, what is actually true, and how you know.

  - type: input
    id: location
    attributes:
      label: Where
      description: The file, or the page's URL. For something missing, where you looked for it.
      placeholder: README.md, "Building"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - Wrong - it does not match the code or the board
        - Missing - nothing covers it
        - Unclear - it is there but hard to follow
        - Broken link or formatting
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What it says, what is true, and the evidence - a `file:line`, a command's output, a log line.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
      description: Optional. If you know what it should say, write it here.
