name: Feature request
description: Something this repository should do that it does not do yet.
type: Feature
assignees:
  - jbenedictocenteno
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not the solution: the best answer is often not the first one proposed. Not sure it is worth an issue yet? Start a [discussion](https://github.com/kodediy/kode-sdk/discussions) instead.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you file
      options:
        - label: I have searched this repository's open and closed issues and found nothing that covers this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including living with it, and why they fall short.

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Sketches, how another project does it, links.
